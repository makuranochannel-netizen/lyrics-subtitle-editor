<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="歌詞字幕">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>歌詞字幕エディタ</title>
<link rel="stylesheet" href="css/app.css">
<script src="vendor/mp4box.all.min.js"></script>
<script src="vendor/mp4-muxer.min.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">歌詞字幕エディタ</div>
    <input id="projectName" class="project-name" placeholder="プロジェクト名" title="プロジェクト名">
    <div class="menu-wrap">
      <button id="btnProjectMenu" class="btn">プロジェクト ▾</button>
      <div id="projectMenu" class="menu" hidden>
        <button data-act="newProject">新規プロジェクト</button>
        <button data-act="openProjects">プロジェクトを開く…</button>
        <button data-act="save">保存 <kbd>⌘/Ctrl+S</kbd></button>
        <hr>
        <button data-act="exportJson">プロジェクトをJSONで書き出し</button>
        <button data-act="importJson">JSONから読み込み…</button>
        <hr>
        <button data-act="exportSrt">字幕を SRT で書き出し</button>
        <button data-act="exportAss">字幕を ASS で書き出し</button>
      </div>
    </div>
    <button id="btnOpenVideo" class="btn primary">動画を開く</button>
    <span id="saveState" class="save-state">—</span>
    <div class="spacer"></div>
    <button id="btnHelp" class="btn ghost" title="ショートカット">⌨ ショートカット</button>
    <button id="btnExport" class="btn accent">MP4 書き出し</button>
  </header>

  <main class="workspace">
    <!-- 左：歌詞とタイミング -->
    <aside class="panel left" id="leftPanel">
      <div class="tabs">
        <button class="tab active" data-tab="timing">歌詞・タイミング</button>
        <button class="tab" data-tab="library">歌詞ライブラリ</button>
      </div>
      <section class="tab-body" data-tab="timing">
        <div class="lyric-head">
          <div>
            <div id="lyricTitle" class="lyric-title">歌詞が未設定です</div>
            <div id="recordStatus" class="muted small"></div>
          </div>
          <div class="row-btns">
            <button id="btnPickLyrics" class="btn sm">ライブラリから</button>
            <button id="btnEditLines" class="btn sm">歌詞を編集</button>
          </div>
        </div>
        <div class="progress-line"><div id="recordProgress"></div></div>
        <div class="lyric-tools">
          <button id="btnCursorTop" class="btn sm ghost" title="記録位置を最初の未記録行へ">⤒ 未記録の先頭へ</button>
          <button id="btnClearTimings" class="btn sm ghost danger" title="すべてのタイミングを消去">タイミング全消去</button>
          <button id="btnShiftAll" class="btn sm ghost" title="全タイミングを一括でずらす">一括ずらし</button>
        </div>
        <ol id="lineList" class="line-list"></ol>
        <div id="lineEmpty" class="empty-hint" hidden>
          <p>まず歌詞を設定してください。</p>
          <button class="btn primary" id="btnEmptyNew">歌詞を新規作成</button>
        </div>
      </section>
      <section class="tab-body" data-tab="library" hidden>
        <div class="lib-head">
          <button id="btnNewLyrics" class="btn primary sm">＋ 新しい歌詞</button>
          <input id="libSearch" type="search" placeholder="検索">
        </div>
        <ul id="libraryList" class="lib-list"></ul>
      </section>
    </aside>

    <!-- 中央：プレビュー -->
    <section class="center">
      <div id="stageWrap" class="stage-wrap">
        <div id="stage" class="stage" hidden>
          <video id="video" playsinline preload="auto"></video>
          <div id="overlay" class="overlay"></div>
          <div id="recordFlash" class="record-flash"></div>
          <div class="rec-badge">● REC</div>
        </div>
        <div id="dropHint" class="drop-hint">
          <div class="drop-icon">🎬</div>
          <p><b>動画をここにドロップ</b> または</p>
          <button class="btn primary" id="btnOpenVideo2">動画を開く</button>
          <p class="muted small">MP4 / MOV（iPhone の縦動画 9:16、横 16:9、正方形 1:1 など）</p>
        </div>
        <div id="reloadBanner" class="reload-banner" hidden></div>
      </div>
      <div class="transport">
        <button id="btnPlay" class="btn icon" title="再生/一時停止 (Space)">▶</button>
        <span id="timeCur" class="time">0:00.000</span><span class="muted">/</span><span id="timeDur" class="time muted">0:00.000</span>
        <input id="seek" type="range" min="0" max="1000" step="1" value="0" class="seek">
        <select id="rate" title="再生速度">
          <option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
        </select>
        <button id="btnMute" class="btn icon ghost" title="ミュート">🔊</button>
      </div>
      <div class="record-bar" id="recordBar">
        <button id="btnRecord" class="btn sm rec">● 記録開始</button>
        <button id="btnTap" class="tap-btn" type="button" tabindex="-1">
          <span class="tap-label"><span class="rec-dot"></span><span id="recordHint">次に記録する歌詞</span><kbd id="recordKeyLabel" hidden>Shift</kbd></span>
          <span id="nextLyric" class="next-lyric">—</span>
        </button>
        <button id="btnUndo" class="btn sm" title="直前の操作を取り消す（⌘/Ctrl+Z）">↶ 取り消し</button>
      </div>
    </section>

    <!-- 右：デザイン -->
    <aside class="panel right" id="rightPanel">
      <div class="panel-title">記録設定</div>
      <div class="style-panel">
        <label class="field"><span>記録キー</span>
          <select id="recordKey">
            <option value="Shift">Shift（左右どちらでも）</option>
            <option value="Enter">Enter</option>
            <option value="KeyJ">J</option>
            <option value="KeyF">F</option>
            <option value="Tab">Tab</option>
          </select>
        </label>
        <label class="field"><span>反応遅れ補正</span>
          <span class="inline"><input id="recordOffset" type="number" step="0.01" min="0" max="1"> 秒 早める</span>
        </label>
        <label class="field"><span>← → の移動量</span>
          <span class="inline"><input id="seekStep" type="number" step="0.5" min="0.1" max="30"> 秒</span>
        </label>
      </div>
      <div class="panel-title">動画情報</div>
      <div id="videoInfo" class="style-panel small muted">動画が読み込まれていません</div>
      <button type="button" class="panel-title collapsible" id="styleTitle" title="クリックで開閉">字幕デザイン<span class="chev">▾</span></button>
      <div id="stylePanel" class="style-panel"></div>
    </aside>
  </main>

  <!-- 下：タイムライン -->
  <footer class="timeline-area">
    <div class="tl-toolbar">
      <button id="btnPlay2" class="btn icon sm" title="再生/一時停止">▶</button>
      <span id="tlTime" class="time small">0:00.000</span>
      <label class="small muted">ズーム <input id="tlZoom" type="range" min="10" max="400" value="80"></label>
      <label class="small muted"><input id="tlFollow" type="checkbox" checked> 再生位置を追従</label>
      <span class="muted small tl-hint">ブロックをドラッグで移動・端をドラッグで開始/終了を調整・空白クリックでシーク</span>
      <div class="spacer"></div>
      <button id="btnCompact" class="btn sm ghost" title="タイムラインを縮めてプレビューを大きくする">⤢ プレビュー拡大</button>
      <button id="btnExport2" class="btn accent sm">MP4 書き出し</button>
    </div>
    <div id="timeline" class="timeline" tabindex="-1">
      <div id="tlInner" class="tl-inner">
        <canvas id="tlRuler" class="tl-ruler"></canvas>
        <canvas id="tlWave" class="tl-wave"></canvas>
        <div id="tlCues" class="tl-cues"></div>
        <div id="tlPlayhead" class="tl-playhead"></div>
      </div>
    </div>
  </footer>
</div>

<!-- モーダル -->
<div id="modal" class="modal" hidden>
  <div class="modal-card" id="modalCard"></div>
</div>
<div id="toast" class="toast"></div>
<input type="file" id="fileVideo" accept="video/mp4,video/quicktime,.mp4,.mov,.m4v" hidden>
<input type="file" id="fileJson" accept="application/json,.json" hidden>
<input type="file" id="fileFont" accept=".ttf,.otf,.woff,.woff2" hidden>
</body>
</html>
