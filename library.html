<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>歌詞ライブラリ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/library-page.js"></script>
</head>
<body class="page-library">
  <header class="topbar lib-topbar">
    <a class="btn" id="btnBack" href="index.html">← エディタ</a>
    <div class="brand">歌詞ライブラリ</div>
    <div class="spacer"></div>
    <button id="btnNewLyrics" class="btn primary">＋ 新しい歌詞</button>
  </header>
  <main class="lib-page">
    <div class="lib-page-head">
      <input id="libSearch" type="search" placeholder="曲名・アーティスト・歌詞で検索">
      <span id="libCount" class="muted small"></span>
    </div>
    <ul id="libraryList" class="lib-list lib-grid"></ul>
  </main>
  <div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>
  <div id="toast" class="toast"></div>
</body>
</html>
