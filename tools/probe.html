<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ブラウザ対応チェック</title>
<script src="../vendor/mp4box.all.min.js"></script><script src="../vendor/mp4-muxer.min.js"></script>
<style>body{font-family:-apple-system,sans-serif;background:#16181f;color:#eee;padding:16px}pre{white-space:pre-wrap;word-break:break-all;font-size:12px}</style></head>
<body><h1>ブラウザ対応チェック</h1><pre id="out">実行中…</pre>
<script type="module">
const R = { ua: navigator.userAgent, secure: isSecureContext };
const out = () => document.getElementById('out').textContent = JSON.stringify(R, null, 1);
const t = async (name, fn) => { try { R[name] = await fn(); } catch (e) { R[name] = 'ERR ' + (e && e.message || e); } out(); };
await t('api', () => ({ VideoEncoder: typeof VideoEncoder, VideoDecoder: typeof VideoDecoder, AudioEncoder: typeof AudioEncoder, AudioDecoder: typeof AudioDecoder, VideoFrame: typeof VideoFrame, OffscreenCanvas: typeof OffscreenCanvas, showOpenFilePicker: typeof window.showOpenFilePicker, showSaveFilePicker: typeof window.showSaveFilePicker, queryLocalFonts: typeof window.queryLocalFonts, indexedDB: typeof indexedDB, rvfc: typeof HTMLVideoElement.prototype.requestVideoFrameCallback, createImageBitmap: typeof createImageBitmap }));
const sup = async (C, cfg) => (await C.isConfigSupported(cfg)).supported;
await t('encAvc1080', () => sup(VideoEncoder, { codec: 'avc1.640028', width: 1080, height: 1920, bitrate: 6e6, framerate: 30 }));
await t('encAvc4k', () => sup(VideoEncoder, { codec: 'avc1.640033', width: 2160, height: 3840, bitrate: 20e6, framerate: 30 }));
await t('decHevc', () => sup(VideoDecoder, { codec: 'hvc1.1.6.L123.B0', codedWidth: 1920, codedHeight: 1080 }));
await t('decAvc', () => sup(VideoDecoder, { codec: 'avc1.640028', codedWidth: 1920, codedHeight: 1080 }));
await t('encAac', () => sup(AudioEncoder, { codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate: 128000 }));
const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="writing-mode:vertical-rl;font:40px 'Hiragino Sans';color:red">縦書き、</div></foreignObject></svg>`;
await t('foreignObjectToVideoFrame', async () => {
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); await img.decode();
  const c = document.createElement('canvas'); c.width = 200; c.height = 100; c.getContext('2d').drawImage(img, 0, 0);
  try { c.getContext('2d').getImageData(0, 0, 1, 1); } catch (e) { return 'tainted(getImageData): ' + e.message; }
  try { new VideoFrame(c, { timestamp: 0 }).close(); return 'ok'; } catch (e) { return 'VideoFrame failed: ' + e.message; }
});
await t('offscreenVideoFrame', () => { const c = new OffscreenCanvas(64, 64); c.getContext('2d').fillRect(0, 0, 10, 10); new VideoFrame(c, { timestamp: 0 }).close(); return 'ok'; });
await t('canShareMp4', () => !!navigator.canShare?.({ files: [new File([new Uint8Array(16)], 'a.mp4', { type: 'video/mp4' })] }));
await t('canvasVerticalText', () => { const c = document.createElement('canvas').getContext('2d'); return 'letterSpacing' in c ? 'letterSpacing ok' : 'no letterSpacing'; });
await t('selftest', async () => {
  const st = await import('./selftest.js');
  st.unitTests();
  // AudioEncoder の無いブラウザ（iPhone Safari など）では、用意済みのテスト動画で検証する
  const files = new URLSearchParams(location.search).get('files');
  if (files) {
    for (const spec of files.split(',')) {
      const [name, w, h, mode] = spec.split(':');
      const b = await (await fetch('_testmedia/' + name)).blob();
      try { await st.verifyFile(new File([b], name, { type: name.endsWith('.mov') ? 'video/quicktime' : 'video/mp4' }), name, +w, +h, mode === 'v' ? { writingMode: 'vertical' } : {}); }
      catch (e) { st.results.push({ name: name + ' 例外', pass: false, detail: e.stack || e.message }); }
    }
  } else {
    await st.exportTest('縦9:16 回転90°', { width: 1080, height: 1920, rotation: 90 }, {});
  }
  return st.results.map(r => (r.pass ? 'OK ' : 'NG ') + r.name + (r.pass ? '' : ' :: ' + String(r.detail).slice(0, 400)));
});
R.done = true; out();
fetch('/report', { method: 'POST', body: JSON.stringify(R, null, 1) });
</script></body></html>
