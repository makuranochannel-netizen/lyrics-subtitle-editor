<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>起動チェック（ライブラリ）</title></head>
<body><iframe id="f" src="../library.html" style="width:390px;height:844px"></iframe>
<script>
const f = document.getElementById('f'), errs = [];
f.addEventListener('load', () => {
  const w = f.contentWindow;
  w.addEventListener('error', e => errs.push(e.message));
  w.addEventListener('unhandledrejection', e => errs.push(String(e.reason)));
  setTimeout(() => {
    const d = w.document;
    fetch('/report', { method: 'POST', body: JSON.stringify({ page: 'library', errs, count: d.querySelector('#libCount')?.textContent, newBtn: !!d.querySelector('#btnNewLyrics') }) });
  }, 2000);
});
</script></body></html>
