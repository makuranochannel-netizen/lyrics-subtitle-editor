<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>起動チェック</title></head>
<body><iframe id="f" src="../index.html?nosw" style="width:390px;height:844px"></iframe><pre id="o"></pre>
<script>
const f = document.getElementById('f'), errs = [];
f.addEventListener('load', () => {
  const w = f.contentWindow;
  w.addEventListener('error', e => errs.push(e.message));
  w.addEventListener('unhandledrejection', e => errs.push(String(e.reason)));
  setTimeout(async () => {
    const d = w.document, a = w.app;
    const fam = d.querySelector('#fontSelect');
    const R = { errs, hasProject: !!a?.project, fonts: fam ? [...fam.querySelectorAll('optgroup')].map(g => g.label + '(' + g.children.length + ')') : null,
      tapBtn: !!d.querySelector('#btnTap'), hideBtn: !!d.querySelector('#btnHideLyric'), libBtn: !!d.querySelector('#btnOpenLibrary'), toast: d.querySelector('#toast')?.textContent };
    document.getElementById('o').textContent = JSON.stringify(R, null, 1);
    fetch('/report', { method: 'POST', body: JSON.stringify(R, null, 1) });
  }, 2500);
});
</script></body></html>
